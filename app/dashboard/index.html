<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NOMAD Data Engine</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; background:#0b0d10; color:#eef2f6; }
    header { padding:28px 34px; border-bottom:1px solid #252a31; display:flex; justify-content:space-between; align-items:center; }
    .brand { font-size:22px; font-weight:800; letter-spacing:.08em; }
    .status { color:#70e1a1; font-size:13px; }
    main { padding:30px 34px; max-width:1300px; margin:auto; }
    .grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:14px; }
    .card { background:#12161b; border:1px solid #252a31; border-radius:14px; padding:20px; }
    .label { color:#8e99a7; font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
    .value { font-size:30px; font-weight:750; margin-top:8px; }
    section { margin-top:26px; }
    h2 { font-size:16px; }
    table { width:100%; border-collapse:collapse; background:#12161b; border:1px solid #252a31; border-radius:14px; overflow:hidden; }
    th,td { text-align:left; padding:12px 14px; border-bottom:1px solid #252a31; font-size:13px; }
    th { color:#8e99a7; font-weight:600; }
    .empty { color:#8e99a7; padding:20px; }
    @media(max-width:900px){ .grid{grid-template-columns:repeat(2,1fr)} }
  </style>
</head>
<body>
<header><div class="brand">NOMAD / DATA ENGINE</div><div class="status">● ENGINE ONLINE</div></header>
<main>
  <div class="grid" id="stats"></div>
  <section><h2>Top artists in canonical dataset</h2><table><thead><tr><th>Artist</th><th>Tracks</th></tr></thead><tbody id="artists"><tr><td colspan="2" class="empty">Loading…</td></tr></tbody></table></section>
  <section><h2>Recent listening events</h2><table><thead><tr><th>Track ID</th><th>User</th><th>Played at</th><th>Source</th><th>Completed</th><th>Skipped</th></tr></thead><tbody id="events"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody></table></section>
</main>
<script>
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load() {
  const [s,a,e] = await Promise.all([fetch('/api/stats'),fetch('/api/artists?limit=10'),fetch('/api/events?limit=20')]);
  const stats = await s.json(), artists = await a.json(), events = await e.json();
  const labels = [['tracks','Tracks'],['artists','Artists'],['playlists','Playlists'],['listening_events','Listening Events'],['fingerprinted_tracks','Fingerprinted']];
  document.getElementById('stats').innerHTML = labels.map(([k,l]) => `<div class="card"><div class="label">${l}</div><div class="value">${stats[k] ?? 0}</div></div>`).join('');
  document.getElementById('artists').innerHTML = artists.length ? artists.map(x => `<tr><td>${esc(x.artist)}</td><td>${x.tracks}</td></tr>`).join('') : '<tr><td colspan="2" class="empty">No artist data yet.</td></tr>';
  document.getElementById('events').innerHTML = events.length ? events.map(x => `<tr><td>${esc(x.track_id)}</td><td>${esc(x.user_id)}</td><td>${esc(x.played_at)}</td><td>${esc(x.source)}</td><td>${!!x.completed}</td><td>${!!x.skipped}</td></tr>`).join('') : '<tr><td colspan="6" class="empty">No listening events yet.</td></tr>';
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
