<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOMAD Data Intelligence</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}body{margin:0;background:#080a0d;color:#eef2f6}header{padding:24px 32px;border-bottom:1px solid #252a31;display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:800;letter-spacing:.08em}.status{color:#70e1a1;font-size:13px}main{padding:28px 32px;max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.card{background:#11151a;border:1px solid #252a31;border-radius:14px;padding:18px}.label{color:#8e99a7;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.value{font-size:28px;font-weight:750;margin-top:7px}section{margin-top:24px}h2{font-size:15px}table{width:100%;border-collapse:collapse;background:#11151a;border:1px solid #252a31;border-radius:14px;overflow:hidden}th,td{text-align:left;padding:11px 13px;border-bottom:1px solid #252a31;font-size:13px}th{color:#8e99a7}.empty{color:#8e99a7;padding:18px}.toolbar{display:flex;gap:10px;align-items:center;margin:18px 0;flex-wrap:wrap}.btn{border:1px solid #39414b;background:#171c22;color:#fff;border-radius:9px;padding:9px 14px;cursor:pointer;text-decoration:none}.btn:hover{background:#20262e}.connected{color:#70e1a1}.muted{color:#8e99a7;font-size:13px}.profile{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.pill{display:inline-block;padding:5px 8px;border:1px solid #303740;border-radius:999px;margin:3px;color:#cbd3dc;font-size:12px}@media(max-width:900px){.grid,.profile{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="brand">NOMAD / DATA INTELLIGENCE</div><div class="status">● PHASE 2 ONLINE</div></header>
<main>
<div class="toolbar"><a class="btn" href="/auth/youtube">▶ Connect YouTube with Google</a><button class="btn" onclick="syncYouTube()">↻ Sync YouTube</button><button class="btn" onclick="syncUser()">↻ Sync NOMAD User</button><button class="btn" onclick="disconnectYouTube()">Disconnect YouTube</button><span id="youtubeStatus" class="muted">Checking YouTube…</span><span id="syncStatus" class="muted">Ready</span></div>
<div class="grid" id="stats"></div>
<section><h2>User Taste Profile</h2><div class="profile" id="profile"><div class="card muted">Loading profile…</div></div></section>
<section><h2>Top artists in canonical dataset</h2><table><thead><tr><th>Artist</th><th>Tracks</th></tr></thead><tbody id="artists"><tr><td colspan="2" class="empty">Loading…</td></tr></tbody></table></section>
<section><h2>Recent listening events</h2><table><thead><tr><th>Track ID</th><th>Artist</th><th>User</th><th>Played at</th><th>Source</th><th>Completed</th><th>Skipped</th></tr></thead><tbody id="events"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody></table></section>
</main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function youtubeStatus(){try{const r=await fetch('/api/youtube/status');const d=await r.json();document.getElementById('youtubeStatus').innerHTML=d.connected?'<span class="connected">● YouTube connected</span>':'● YouTube not connected'}catch(e){document.getElementById('youtubeStatus').textContent='OAuth status unavailable'}}
async function load(){try{const [s,a,e,p]=await Promise.all([fetch('/api/stats'),fetch('/api/artists?limit=10'),fetch('/api/events?limit=20'),fetch('/api/profile')]);const stats=await s.json(),artists=await a.json(),events=await e.json(),profile=await p.json();const labels=[['tracks','Tracks'],['artists','Artists'],['playlists','Playlists'],['listening_events','Listening Events'],['fingerprinted_tracks','Fingerprinted']];document.getElementById('stats').innerHTML=labels.map(([k,l])=>`<div class="card"><div class="label">${l}</div><div class="value">${stats[k]??0}</div></div>`).join('');document.getElementById('artists').innerHTML=artists.length?artists.map(x=>`<tr><td>${esc(x.artist)}</td><td>${x.tracks}</td></tr>`).join(''):'<tr><td colspan="2" class="empty">No artist data yet.</td></tr>';document.getElementById('events').innerHTML=events.length?events.map(x=>`<tr><td>${esc(x.track_id)}</td><td>${esc(x.artist)}</td><td>${esc(x.user_id)}</td><td>${esc(x.played_at)}</td><td>${esc(x.source)}</td><td>${!!x.completed}</td><td>${!!x.skipped}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">No listening events yet.</td></tr>';const top=Object.entries(profile.artist_affinity||{}).slice(0,8);document.getElementById('profile').innerHTML=`<div class="card"><div class="label">Plays</div><div class="value">${profile.plays||0}</div></div><div class="card"><div class="label">Completion</div><div class="value">${Math.round((profile.completion_rate||0)*100)}%</div></div><div class="card"><div class="label">Skip rate</div><div class="value">${Math.round((profile.skip_rate||0)*100)}%</div><div class="muted">Top artist affinity</div>${top.map(([k,v])=>`<span class="pill">${esc(k)} ${Math.round(v*100)}%</span>`).join('')}</div>`;await youtubeStatus()}catch(err){document.getElementById('syncStatus').textContent='Dashboard API error: '+err}}
async function syncYouTube(){const s=document.getElementById('syncStatus');s.textContent='Syncing YouTube…';try{const r=await fetch('/api/youtube/sync',{method:'POST'});const d=await r.json();if(!r.ok)throw new Error(d.detail||'YouTube sync failed');s.textContent=`YouTube: ${d.liked_videos} likes, ${d.playlists} playlists, ${d.subscriptions} subscriptions`;await load()}catch(e){s.textContent=String(e)}}
async function disconnectYouTube(){await fetch('/api/youtube/disconnect',{method:'POST'});await youtubeStatus();document.getElementById('syncStatus').textContent='YouTube disconnected'}
async function syncUser(){const s=document.getElementById('syncStatus');s.textContent='Syncing NOMAD user…';try{const r=await fetch('/api/sync/user',{method:'POST'});const data=await r.json();if(!r.ok)throw new Error(data.detail||'sync failed');s.textContent=`NOMAD: ${JSON.stringify(data.synced)}`;await load()}catch(err){s.textContent=String(err)}}
load();setInterval(load,5000);
</script>
</body></html>
