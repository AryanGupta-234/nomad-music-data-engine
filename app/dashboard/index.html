<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOMAD Song Data</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}body{margin:0;background:#080a0d;color:#eef2f6}header{padding:24px 32px;border-bottom:1px solid #252a31;display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:800;letter-spacing:.08em}.status{color:#70e1a1;font-size:13px}main{padding:28px 32px;max-width:1500px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:#11151a;border:1px solid #252a31;border-radius:14px;padding:18px}.label{color:#8e99a7;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.value{font-size:28px;font-weight:750;margin-top:7px}section{margin-top:24px}h2{font-size:15px}.toolbar{display:flex;gap:10px;align-items:center;margin:18px 0;flex-wrap:wrap}.btn{border:1px solid #39414b;background:#171c22;color:#fff;border-radius:9px;padding:9px 14px;cursor:pointer;text-decoration:none}.btn:hover{background:#20262e}.connected{color:#70e1a1}.muted{color:#8e99a7;font-size:13px}input{background:#11151a;border:1px solid #39414b;color:#fff;border-radius:9px;padding:10px 12px;min-width:280px}table{width:100%;border-collapse:collapse;background:#11151a;border:1px solid #252a31;border-radius:14px;overflow:hidden}th,td{text-align:left;padding:11px 13px;border-bottom:1px solid #252a31;font-size:13px}th{color:#8e99a7}.song{display:flex;gap:12px;align-items:center}.cover{width:48px;height:48px;object-fit:cover;border-radius:7px;background:#20262e}.title{font-weight:650}.sub{color:#8e99a7;font-size:12px;margin-top:3px}.badge{display:inline-block;padding:4px 7px;border:1px solid #303740;border-radius:999px;color:#bfc8d2;font-size:11px}.ok{color:#70e1a1}.warn{color:#e9c46a}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}main{padding:20px 14px}}
</style>
</head>
<body>
<header><div class="brand">NOMAD / SONG DATA</div><div class="status">● PHASE 2 ONLINE</div></header>
<main>
<div class="toolbar"><a class="btn" href="/auth/youtube">▶ Connect YouTube with Google</a><button class="btn" onclick="syncYouTube()">↻ Sync YouTube Songs</button><button class="btn" onclick="disconnectYouTube()">Disconnect YouTube</button><input id="search" placeholder="Search songs or artists…" oninput="loadSongs()"><span id="youtubeStatus" class="muted">Checking YouTube…</span><span id="syncStatus" class="muted">Ready</span></div>
<div class="grid" id="stats"></div>
<section><h2>Canonical song dataset</h2><table><thead><tr><th>Song</th><th>Artist / Channel</th><th>Duration</th><th>Source</th><th>Fingerprint</th><th>YouTube</th></tr></thead><tbody id="songs"><tr><td colspan="6" class="muted">Loading…</td></tr></tbody></table></section>
</main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function duration(ms){if(!ms)return '—';const s=Math.floor(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
async function youtubeStatus(){try{const r=await fetch('/api/youtube/status');const d=await r.json();document.getElementById('youtubeStatus').innerHTML=d.connected?'<span class="connected">● YouTube connected</span>':'● YouTube not connected'}catch(e){document.getElementById('youtubeStatus').textContent='OAuth status unavailable'}}
async function loadSongs(){try{const q=encodeURIComponent(document.getElementById('search').value);const [s,t]=await Promise.all([fetch('/api/stats'),fetch('/api/tracks?limit=200&search='+q)]);const stats=await s.json(),songs=await t.json();const labels=[['tracks','Songs'],['youtube_tracks','YouTube Songs'],['fingerprinted_tracks','Fingerprinted'],['tracks_with_duration','With Duration']];document.getElementById('stats').innerHTML=labels.map(([k,l])=>`<div class="card"><div class="label">${l}</div><div class="value">${stats[k]??0}</div></div>`).join('');document.getElementById('songs').innerHTML=songs.length?songs.map(x=>{const yt=x.metadata?.youtube||{};const url=yt.url||'';return `<tr><td><div class="song">${x.artwork_url?`<img class="cover" src="${esc(x.artwork_url)}">`:'<div class="cover"></div>'}<div><div class="title">${esc(x.title)}</div><div class="sub">${esc(x.track_id)}</div></div></div></td><td>${esc(x.artist)}<div class="sub">${esc(yt.channel_title||'')}</div></td><td>${duration(x.duration_ms)}</td><td><span class="badge">${esc(Object.keys(x.source_ids||{}).join(' + ')||'unknown')}</span></td><td>${esc(String(x.fingerprint).slice(0,16))}…</td><td>${url?`<a class="btn" href="${esc(url)}" target="_blank">Open</a>`:'—'}</td></tr>`}).join(''):'<tr><td colspan="6" class="muted">No songs found.</td></tr>';await youtubeStatus()}catch(err){document.getElementById('syncStatus').textContent='Dashboard API error: '+err}}
async function syncYouTube(){const s=document.getElementById('syncStatus');s.textContent='Fetching all available liked videos and hydrating song details…';try{const r=await fetch('/api/youtube/sync',{method:'POST'});const d=await r.json();if(!r.ok)throw new Error(d.detail||'YouTube sync failed');s.textContent=`Fetched ${d.liked_items_fetched}, hydrated ${d.videos_hydrated}, imported ${d.music_songs_imported} music songs; skipped ${d.non_music_skipped} non-music`;await loadSongs()}catch(e){s.textContent=String(e)}}
async function disconnectYouTube(){await fetch('/api/youtube/disconnect',{method:'POST'});await youtubeStatus();document.getElementById('syncStatus').textContent='YouTube disconnected'}
loadSongs();setInterval(loadSongs,10000);
</script>
</body></html>
